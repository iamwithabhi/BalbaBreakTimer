; Balba break timer - Bulbasaur at the laptop, rendered entirely on the CPU (no GPU) on a LilyGO T-Display-S3.
;
; assets/balba.bin is baked on the PC from the original 3D assets:  bulbasaur.exe --export balba.bin
; (see export_to_board.bat in the desktop project). It is embedded in the firmware, so there is nothing else to upload.

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.embed_files = assets/balba.bin
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
build_unflags = -Os -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    ; render resolution divisor: 2 = 160x85 upscaled 2x (fast), 1 = full 320x170 (sharper, ~4x the pixel work)
    -DBALBA_RENDER_DIV=2
